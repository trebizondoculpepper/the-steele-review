name: Publish application image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Scanner pinned by version (#297); the action is pinned by commit below.
  TRIVY_VERSION: v0.76.2

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and smoke-test the ARM64 image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          docker build --target app \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "$image" .
          test "$(docker image inspect --format '{{.Architecture}}' "$image")" = arm64
          docker run --rm --network none --entrypoint node "$image" \
            -e 'for (const name of ["article-worker", "approval-dispatcher", "captured-bridge", "draft-package", "dummy-publisher", "select-saved-evidence", "writer-package"]) require("node:fs").accessSync("dist/cli/" + name + ".js")'

      # Fails closed: a detected secret or a scan that cannot complete stops
      # the job here, so the push below never runs. Results go to a file and
      # only rule IDs and paths reach the summary; match text is never shown.
      - name: Scan the image for secrets (blocks publishing)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: image
          image-ref: ${{ env.IMAGE }}
          scanners: secret
          format: json
          output: trivy-secrets.json
          exit-code: "1"
          hide-progress: true

      - name: Summarise the secret scan
        if: always()
        run: scripts/trivy-summary.sh secrets trivy-secrets.json >> "$GITHUB_STEP_SUMMARY"

      - name: Scan the image for known vulnerabilities (report only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: image
          image-ref: ${{ env.IMAGE }}
          scanners: vuln
          format: json
          output: trivy-vulns.json
          exit-code: "0"
          hide-progress: true
          skip-setup-trivy: true

      - name: Summarise known vulnerabilities
        run: scripts/trivy-summary.sh vulns trivy-vulns.json >> "$GITHUB_STEP_SUMMARY"

      - name: Push the commit-tagged image to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"

  # Proves the secret gate blocks publishing, without registry permissions and
  # without any credential-shaped string in the repository: a test-only rule
  # and a value generated at runtime, in a throwaway image that is never pushed.
  secret-gate-test:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build a throwaway image with a synthetic secret
        run: |
          work="$(mktemp -d)"
          printf 'synthetic_value=STEELESYNTHETIC%s\n' "$(openssl rand -hex 16)" > "$work/leak.conf"
          printf 'FROM busybox:1.37.0\nCOPY leak.conf /etc/leak.conf\n' > "$work/Dockerfile"
          docker build --quiet --tag steele-secret-gate-test:local "$work" > /dev/null
          cat > trivy-secret-test.yaml <<'EOF'
          rules:
            - id: steele-synthetic-test
              category: test
              title: Synthetic test secret
              severity: CRITICAL
              regex: STEELESYNTHETIC[0-9a-f]{32}
          EOF
          printf 'secret:\n  config: trivy-secret-test.yaml\n' > trivy-test.yaml

      - name: Scan the throwaway image (must fail)
        id: scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: image
          image-ref: steele-secret-gate-test:local
          scanners: secret
          trivy-config: trivy-test.yaml
          format: json
          output: trivy-gate-test.json
          exit-code: "1"
          hide-progress: true

      - name: Gated push (must be skipped)
        id: push
        if: steps.scan.outcome == 'success'
        run: echo "would push"

      - name: Check the gate held
        run: |
          scripts/trivy-summary.sh secrets trivy-gate-test.json >> "$GITHUB_STEP_SUMMARY"
          test "${{ steps.scan.outcome }}" = failure
          test "${{ steps.push.outcome }}" = skipped
          jq -e '[.Results[]?.Secrets[]? | select(.RuleID == "steele-synthetic-test")] | length > 0' trivy-gate-test.json > /dev/null
          echo "Secret gate held: synthetic secret detected and the push step was skipped."
