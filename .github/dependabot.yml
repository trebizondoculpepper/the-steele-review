# Dependency version updates (#298). Bot PRs go through normal review and CI;
# nothing is auto-merged.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    groups:
      # One weekly PR for minor and patch updates; majors stay separate.
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    ignore:
      # Stay on the current Node major; a major upgrade is reviewed separately.
      - dependency-name: node
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
