# Separately named experiment stack (#918). Real values are supplied privately:
#   STEELE_EXP_MASTRA_BIND   host address:port to publish on. PRIVATE INTERFACE ONLY: Studio
#                            and the API have no login (#930), so this bind is the access control.
#   STEELE_EXP_MASTRA_DATA     host directory for persistent LibSQL storage
name: steele-exp-mastra
services:
  mastra:
    image: steele-exp-mastra:${STEELE_EXP_MASTRA_TAG:?set the image tag}
    restart: unless-stopped
    ports:
      - "${STEELE_EXP_MASTRA_BIND:?set a private bind address}:4111"
    environment:
      STEELE_EXP_MASTRA_DB: file:/data/mastra.db
      STEELE_EXP_MASTRA_FEED_DB: file:/data/feed.db
      STEELE_EXP_MASTRA_SOURCES_DB: file:/data/sources.db
    volumes:
      - ${STEELE_EXP_MASTRA_DATA:?set the data directory}:/data
    mem_limit: 768m
    read_only: true
    tmpfs:
      - /tmp
