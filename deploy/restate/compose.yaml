# Restate proof of concept for unattended article runs (#243).
# A pinned Restate server with a persistent volume, and the TypeScript
# article worker on the internal network. Paths and credentials come from
# the environment (.env next to this file, never committed); see
# doc/operations/article-pipeline.md.
services:
  restate:
    image: docker.restate.dev/restatedev/restate:1.8.1
    restart: unless-stopped
    volumes:
      - restate-data:/restate-data
    ports:
      # Host bindings stay on loopback; override them where 8080 or 9070 is taken.
      - "${RESTATE_INGRESS_BIND:-127.0.0.1:8080}:8080" # ingress
      - "${RESTATE_ADMIN_BIND:-127.0.0.1:9070}:9070" # admin API
    networks: [steele]

  article-worker:
    image: ${STEELE_IMAGE:-steele-review:latest}
    command: ["node", "--enable-source-maps", "dist/cli/article-worker.js"]
    restart: unless-stopped
    # Must own the bind-mounted repositories and state directory.
    user: "${STEELE_UID:-1000}:${STEELE_GID:-1000}"
    # The image's default check probes the HTTP API on 3000; the worker serves
    # the Restate SDK over HTTP/2 on 9080, so probe its /health instead.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const c=require('node:http2').connect('http://127.0.0.1:9080');c.on('error',()=>process.exit(1));const r=c.request({':path':'/health'});r.on('response',h=>process.exit(h[':status']===200?0:1));r.on('error',()=>process.exit(1));r.end()"
      interval: 30s
      timeout: 10s
      start_period: 20s
    environment:
      # Read-only completion lookup for explicitly requested editorial continuation.
      RESTATE_INGRESS_URL: http://restate:8080
      SENTRY_DSN: ${SENTRY_DSN:-}
      STEELE_ARCHIVE_PATH: /data/archive
      STEELE_ARCHIVE_REPOSITORY: ${STEELE_ARCHIVE_REPOSITORY}
      STEELE_CONTENT_PATH: /data/content
      STEELE_CONTENT_REPOSITORY: ${STEELE_CONTENT_REPOSITORY}
      STEELE_STATE_PATH: /data/state/article-worker.sqlite
      STEELE_MODEL: ${STEELE_MODEL}
      STEELE_MODEL_WRITER: ${STEELE_MODEL_WRITER:-}
      OPENROUTER_API_KEY_FILE: /run/secrets/openrouter
      STEELE_MONITORED_HOSTS: ${STEELE_MONITORED_HOSTS:-}
      # Unattended research (#317). Empty values use the code defaults; the
      # batch deadline is a bridge setting (STEELE_RESEARCH_DEADLINE_MS).
      STEELE_RESEARCH_MODEL: ${STEELE_RESEARCH_MODEL:-}
      STEELE_RESEARCH_TIMEOUT_MS: ${STEELE_RESEARCH_TIMEOUT_MS:-}
      STEELE_RESEARCH_MAX_OUTPUT_TOKENS: ${STEELE_RESEARCH_MAX_OUTPUT_TOKENS:-}
      # Same-speaker history in the essay (#370). Off while ELASTICSEARCH_URL is
      # empty; the article then has no historical section.
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-}
      # Optional API key for an authenticated index. Use the direct form, or set
      # the _FILE form to a path inside a mounted secret; empty values are ignored.
      ELASTICSEARCH_API_KEY: ${ELASTICSEARCH_API_KEY:-}
      ELASTICSEARCH_API_KEY_FILE: ${ELASTICSEARCH_API_KEY_FILE:-}
      STEELE_MODEL_HISTORY: ${STEELE_MODEL_HISTORY:-}
    volumes:
      - ${STEELE_ARCHIVE_DIR}:/data/archive:ro
      - ${STEELE_CONTENT_DIR}:/data/content
      - ${STEELE_STATE_DIR}:/data/state
    secrets: [openrouter]
    networks: [steele]

  # LAN-only operator dashboard (#375). No login by owner decision: exposure
  # is set by STEELE_DASHBOARD_BIND, configured privately (for example the
  # Pi's LAN address and a port). The default binds to loopback only.
  dashboard:
    # Its own image variable, so the dashboard can be updated alone (#476);
    # it falls back to the shared application image.
    image: ${STEELE_DASHBOARD_IMAGE:-${STEELE_IMAGE:-steele-review:latest}}
    command: ["node", "--enable-source-maps", "dist/cli/dashboard.js"]
    restart: unless-stopped
    user: "${STEELE_UID:-1000}:${STEELE_GID:-1000}"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8090/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
    environment:
      # Read-only sources (#377); each is optional and shown as unconfigured
      # when empty.
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-}
      ELASTICSEARCH_API_KEY: ${ELASTICSEARCH_API_KEY:-}
      RESTATE_INGRESS_URL: http://restate:8080
      # Archived-revision trigger (#379): off unless the exact browser origin is
      # set; research bounds default in the service. Empty values are ignored.
      STEELE_DASHBOARD_ORIGIN: ${STEELE_DASHBOARD_ORIGIN:-}
      # Links to Restate's own execution UI (#561): set privately to enable.
      STEELE_RESTATE_UI_URL: ${STEELE_RESTATE_UI_URL:-}
      STEELE_RESTATE_ADMIN_URL: ${STEELE_RESTATE_ADMIN_URL:-}
      STEELE_DASHBOARD_RESEARCH_REQUEST_LIMIT: ${STEELE_DASHBOARD_RESEARCH_REQUEST_LIMIT:-}
      STEELE_DASHBOARD_RESEARCH_DEADLINE_MS: ${STEELE_DASHBOARD_RESEARCH_DEADLINE_MS:-}
      STEELE_DASHBOARD_DESTINATIONS: ${STEELE_DASHBOARD_DESTINATIONS:-}
      STEELE_ARCHIVE_PATH: /data/archive
      STEELE_ARCHIVE_REPOSITORY: ${STEELE_ARCHIVE_REPOSITORY}
      STEELE_CONTENT_PATH: /data/content
      STEELE_CONTENT_REPOSITORY: ${STEELE_CONTENT_REPOSITORY}
      # Recovery identities (#480) live in the worker's state controller. The
      # dashboard writes only tiny recovery records through that controller,
      # never SQL, and reads pipeline counts through its inspection API.
      STEELE_STATE_PATH: /data/state/article-worker.sqlite
    volumes:
      - ${STEELE_ARCHIVE_DIR}:/data/archive:ro
      - ${STEELE_CONTENT_DIR}:/data/content:ro
      - ${STEELE_STATE_DIR}:/data/state
    ports:
      - "${STEELE_DASHBOARD_BIND:-127.0.0.1:8090}:8090"
    networks: [steele]

  # Publishes approved articles from the worker's state outbox to
  # STEELE_PUBLICATION (#314). Shares the worker's state file, never content.
  approval-dispatcher:
    image: ${STEELE_IMAGE:-steele-review:latest}
    command: ["node", "--enable-source-maps", "dist/cli/approval-dispatcher.js"]
    restart: unless-stopped
    user: "${STEELE_UID:-1000}:${STEELE_GID:-1000}"
    healthcheck:
      disable: true
    environment:
      SENTRY_DSN: ${SENTRY_DSN:-}
      NATS_URL: ${NATS_URL}
      # Optional broker token; empty means an unauthenticated broker.
      NATS_TOKEN: ${NATS_TOKEN:-}
      STEELE_STATE_PATH: /data/state/article-worker.sqlite
    volumes:
      - ${STEELE_STATE_DIR}:/data/state
    networks: [steele]

  # Placeholder destination A (#315): its own durable consumer and destination
  # name; writes receipts marked simulated, never calls anything external.
  dummy-publisher-a:
    image: ${STEELE_IMAGE:-steele-review:latest}
    command: ["node", "--enable-source-maps", "dist/cli/dummy-publisher.js"]
    restart: unless-stopped
    user: "${STEELE_UID:-1000}:${STEELE_GID:-1000}"
    healthcheck:
      disable: true
    environment:
      NATS_URL: ${NATS_URL}
      NATS_TOKEN: ${NATS_TOKEN:-}
      STEELE_CONTENT_PATH: /data/content
      STEELE_CONTENT_REPOSITORY: ${STEELE_CONTENT_REPOSITORY}
      STEELE_STATE_PATH: /data/state/article-worker.sqlite
      STEELE_PUBLISHER_DESTINATION: dummy-a
      STEELE_PUBLISHER_CONSUMER: steele-dummy-publisher-a
      SENTRY_DSN: ${SENTRY_DSN:-}
    volumes:
      - ${STEELE_CONTENT_DIR}:/data/content
      - ${STEELE_STATE_DIR}:/data/state
    networks: [steele]

  # Placeholder destination B (#315): its own durable consumer and destination
  # name; writes receipts marked simulated, never calls anything external.
  dummy-publisher-b:
    image: ${STEELE_IMAGE:-steele-review:latest}
    command: ["node", "--enable-source-maps", "dist/cli/dummy-publisher.js"]
    restart: unless-stopped
    user: "${STEELE_UID:-1000}:${STEELE_GID:-1000}"
    healthcheck:
      disable: true
    environment:
      NATS_URL: ${NATS_URL}
      NATS_TOKEN: ${NATS_TOKEN:-}
      STEELE_CONTENT_PATH: /data/content
      STEELE_CONTENT_REPOSITORY: ${STEELE_CONTENT_REPOSITORY}
      STEELE_STATE_PATH: /data/state/article-worker.sqlite
      STEELE_PUBLISHER_DESTINATION: dummy-b
      STEELE_PUBLISHER_CONSUMER: steele-dummy-publisher-b
      SENTRY_DSN: ${SENTRY_DSN:-}
    volumes:
      - ${STEELE_CONTENT_DIR}:/data/content
      - ${STEELE_STATE_DIR}:/data/state
    networks: [steele]

  # Live Substack destination, draft-only (#385). Delivery stays off until
  # STEELE_SUBSTACK_DELIVERY=live (the one-draft proof, #384). Its consumer
  # must be provisioned new-only (STEELE_PUBLISHER_NEW_ONLY_CONSUMERS) so an
  # existing approval backlog never becomes real drafts. The origin and the
  # session file path are private deployment settings.
  substack-publisher:
    image: ${STEELE_IMAGE:-steele-review:latest}
    command: ["node", "--enable-source-maps", "dist/cli/substack-publisher.js"]
    restart: unless-stopped
    user: "${STEELE_UID:-1000}:${STEELE_GID:-1000}"
    healthcheck:
      disable: true
    environment:
      SENTRY_DSN: ${SENTRY_DSN:-}
      NATS_URL: ${NATS_URL}
      NATS_TOKEN: ${NATS_TOKEN:-}
      STEELE_CONTENT_PATH: /data/content
      STEELE_CONTENT_REPOSITORY: ${STEELE_CONTENT_REPOSITORY}
      STEELE_STATE_PATH: /data/state/article-worker.sqlite
      STEELE_SUBSTACK_ORIGIN: ${STEELE_SUBSTACK_ORIGIN}
      STEELE_SUBSTACK_SESSION_FILE: /run/secrets/substack-session
      STEELE_SUBSTACK_DELIVERY: ${STEELE_SUBSTACK_DELIVERY:-off}
    volumes:
      - ${STEELE_CONTENT_DIR}:/data/content
      - ${STEELE_STATE_DIR}:/data/state
    secrets: [substack-session]
    networks: [steele]

volumes:
  restate-data:

networks:
  steele:

secrets:
  openrouter:
    file: ${OPENROUTER_KEY_FILE}
  substack-session:
    file: ${SUBSTACK_SESSION_FILE:-/dev/null}
